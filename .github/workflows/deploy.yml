# Деплой на GitHub Pages. Заработает после `npm create vite` (нужны package.json
# и package-lock.json). В настройках репозитория: Settings → Pages → Source: GitHub Actions.
# В vite.config.ts: base: '/living-room/' (имя репозитория).
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build          # внутри: проверка layout.json схемой, потом vite build
      - run: cp dist/index.html dist/404.html   # прямые ссылки не дают 404 на Pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<text x="554" y="100" font-size="20" font-weight="700" fill="#2b2b2b">Кухня, вариант A — Угловая</text>
<text x="554" y="124" font-size="20" font-weight="700" fill="#2b2b2b">кухня</text>
<text x="554" y="148" font-size="12" fill="#6d6a65">Г-образный гарнитур: вдоль восточной стены</text>
<text x="554" y="164" font-size="12" fill="#6d6a65">плита, посудомойка рядом с мойкой, мойка в</text>
<text x="554" y="180" font-size="12" fill="#6d6a65">углу у санузла (ближе к стоякам); у стены</text>
<text x="554" y="196" font-size="12" fill="#6d6a65">санузла холодильник у входа. Верхние шкафы до</text>
<text x="554" y="212" font-size="12" fill="#6d6a65">потолка, над плитой вытяжка. Маленький стол</text>
<text x="554" y="228" font-size="12" fill="#6d6a65">70×50 на двоих у стены к залу, у окна.</text>
<text x="554" y="254" font-size="13" font-weight="700" fill="#d48a00">!</text>

<text x="558.5" y="124" font-size="20" font-weight="700" fill="#2b2b2b">Шкаф-купе в нише</text>
<text x="558.5" y="148" font-size="12" fill="#6d6a65">Ниша справа от входа целиком под встроенный</text>

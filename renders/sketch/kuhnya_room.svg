<text x="570" y="182" font-size="12" fill="#2b2b2b">236 × 268 см = 6.32 м², потолок 250</text>
<text x="554" y="202" font-size="13" font-weight="700" fill="#8a857d">·</text>
<text x="570" y="202" font-size="12" fill="#2b2b2b">Из прихожей: 74 см</text>
<text x="554" y="222" font-size="13" font-weight="700" fill="#8a857d">·</text>
<text x="570" y="222" font-size="12" fill="#2b2b2b">Окно: 150 см, подоконник 90, высота 135</text>
<text x="554" y="242" font-size="13" font-weight="700" fill="#d48a00">!</text>
<text x="570" y="242" font-size="12" fill="#2b2b2b">Все размеры — оценка. Точные цифры дадут</text>
<text x="570" y="257" font-size="12" fill="#2b2b2b">замеры.</text>
<text x="50" y="846" font-size="11" fill="#8a857d">Кухня: набросок по площади 5.8 м², плану БТИ и фото. Размеры ориентировочные до замеров. 2026-11-20</text>

<text x="671" y="257" font-size="13" font-weight="700" fill="#2e8b57">✓</text>
<text x="687" y="257" font-size="12" fill="#2b2b2b">Подход к окну (открыть створку): 69 см</text>
<text x="687" y="272" font-size="12" fill="#2b2b2b">(норма ≥ 60)</text>
<text x="671" y="292" font-size="13" font-weight="700" fill="#2e8b57">✓</text>
<text x="687" y="292" font-size="12" fill="#2b2b2b">Подход к кровати с восточной стороны (зал):</text>
<text x="687" y="307" font-size="12" fill="#2b2b2b">79 см (норма 70, минимум 60)</text>
<text x="671" y="327" font-size="13" font-weight="700" fill="#2e8b57">✓</text>
<text x="687" y="327" font-size="12" fill="#2b2b2b">Подход к кровати с западной стороны</text>
<text x="687" y="342" font-size="12" fill="#2b2b2b">(лоджия): 70 см (норма 70, минимум 60)</text>

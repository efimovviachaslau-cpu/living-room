<text x="671" y="100" font-size="20" font-weight="700" fill="#2b2b2b">Спальня, вариант C — Шкаф</text>
<text x="671" y="124" font-size="20" font-weight="700" fill="#2b2b2b">вместо правой тумбочки</text>
<text x="671" y="148" font-size="12" fill="#6d6a65">Как A, но у стены к залу вместо тумбочки —</text>
<text x="671" y="164" font-size="12" fill="#6d6a65">шкаф 60×60, дверцы к проходу. Проход к лоджии</text>
<text x="671" y="180" font-size="12" fill="#6d6a65">остаётся, тумбочка и светильник — только</text>
<text x="671" y="196" font-size="12" fill="#6d6a65">слева.</text>
<text x="671" y="222" font-size="13" font-weight="700" fill="#2e8b57">✓</text>
<text x="687" y="222" font-size="12" fill="#2b2b2b">Проход от входа к двери «На лоджию»: 70 см</text>

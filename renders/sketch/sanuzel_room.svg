<text x="414.5" y="100" font-size="20" font-weight="700" fill="#2b2b2b">Санузел — геометрия</text>
<text x="414.5" y="124" font-size="12" fill="#6d6a65">Начало координат — Угол у кухни и коридора.</text>
<text x="414.5" y="140" font-size="12" fill="#6d6a65">Стены по часовой: С1 запад (коридор, дверь),</text>
<text x="414.5" y="156" font-size="12" fill="#6d6a65">С2 север (прихожая), С3 восток (лестница), С4</text>
<text x="414.5" y="172" font-size="12" fill="#6d6a65">юг (кухня).</text>
<text x="414.5" y="198" font-size="13" font-weight="700" fill="#8a857d">·</text>
<text x="430.5" y="198" font-size="12" fill="#2b2b2b">143 × 206 см = 2.95 м², потолок 250</text>
<text x="414.5" y="218" font-size="13" font-weight="700" fill="#8a857d">·</text>
<text x="430.5" y="218" font-size="12" fill="#2b2b2b">Из коридора: 70 см</text>
<text x="414.5" y="238" font-size="13" font-weight="700" fill="#d48a00">!</text>
<text x="430.5" y="238" font-size="12" fill="#2b2b2b">Все размеры — оценка. Точные цифры дадут</text>
<text x="430.5" y="253" font-size="12" fill="#2b2b2b">замеры.</text>
<text x="50" y="706.5" font-size="11" fill="#8a857d">Санузел: набросок по площади 3.1 м², плану БТИ и фото. Размеры ориентировочные до замеров. 2026-11-20</text>

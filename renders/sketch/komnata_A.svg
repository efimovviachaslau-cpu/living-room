<text x="671" y="100" font-size="20" font-weight="700" fill="#2b2b2b">Комната 7.5, вариант A —</text>
<text x="671" y="124" font-size="20" font-weight="700" fill="#2b2b2b">Кабинет и гостевая</text>
<text x="671" y="148" font-size="12" fill="#6d6a65">Вдоль северной стены рабочий стол (окно слева</text>
<text x="671" y="164" font-size="12" fill="#6d6a65">от сидящего — свет не бьёт в монитор, нет тени</text>
<text x="671" y="180" font-size="12" fill="#6d6a65">от правой руки) и шкаф. Вдоль перегородки</text>
<text x="671" y="196" font-size="12" fill="#6d6a65">2-местный диван-кровать для гостей. Перед</text>
<text x="671" y="212" font-size="12" fill="#6d6a65">окном и от двери свободно.</text>
<text x="671" y="238" font-size="13" font-weight="700" fill="#2e8b57">✓</text>
<text x="687" y="238" font-size="12" fill="#2b2b2b">Подход к окну (открыть створку): 62 см</text>
